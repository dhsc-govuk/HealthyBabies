server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers at the server level apply only when a location block defines NO add_header
    # directives of its own (nginx inheritance rule). The two location blocks below both define
    # add_header, so they must repeat every security header they need. If you change any header
    # here, update the location blocks too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com https://*.microsoftonline.com https://*.msftauth.net https://*.ciamlogin.com https://dc.services.visualstudio.com https://*.applicationinsights.azure.com https://*.monitor.azure.com wss:; frame-src https://login.microsoftonline.com https://*.microsoftonline.com https://*.ciamlogin.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Static assets — content-hash filenames make these safe to cache indefinitely.
    # Security headers repeated because nginx does not inherit add_header from the server block
    # when this location block defines its own add_header directives.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com https://*.microsoftonline.com https://*.msftauth.net https://*.ciamlogin.com https://dc.services.visualstudio.com https://*.applicationinsights.azure.com https://*.monitor.azure.com wss:; frame-src https://login.microsoftonline.com https://*.microsoftonline.com https://*.ciamlogin.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Handle SPA routing — serve index.html for all routes.
    # BASE_PATH prefix is stripped by the upstream proxy (Front Door) before reaching this server.
    # Never cache index.html: it is the SPA entry point and must always be fresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com https://*.microsoftonline.com https://*.msftauth.net https://*.ciamlogin.com https://dc.services.visualstudio.com https://*.applicationinsights.azure.com https://*.monitor.azure.com wss:; frame-src https://login.microsoftonline.com https://*.microsoftonline.com https://*.ciamlogin.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
