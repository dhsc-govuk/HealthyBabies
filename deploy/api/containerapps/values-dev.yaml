#@data/values
---
managed_identity_resource_id: "/subscriptions/YOUR_SUBSCRIPTION_ID/resourceGroups/YOUR_RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities/YOUR_MANAGED_IDENTITY_NAME"
managed_environment_id: "/subscriptions/YOUR_SUBSCRIPTION_ID/resourceGroups/YOUR_RESOURCE_GROUP/providers/Microsoft.App/managedEnvironments/YOUR_CONTAINER_APPS_ENVIRONMENT_NAME"
location: uksouth
target_port: 80
transport: http
external: true
allow_insecure: true
min_replicas: 1
max_replicas: 3
tags:
  Compliance: "NHS Official"
  Environment: "dev"
  Lifecycle: "Active"
  Project: "Family Hubs"
  Team: "Family Hubs"
resources:
  cpu: 0.5
  memory: "1Gi"
  ephemeral_storage: "1Gi"
secrets:
  - name: dbconnection
    keyVaultUrl: https://YOUR_KEY_VAULT_NAME.vault.azure.net/secrets/dbconnection
  - name: blobconnection
    keyVaultUrl: https://YOUR_KEY_VAULT_NAME.vault.azure.net/secrets/blobconnection
  - name: graphsecret
    keyVaultUrl: https://YOUR_KEY_VAULT_NAME.vault.azure.net/secrets/graphsecret
  - name: emailconnection
    keyVaultUrl: https://YOUR_KEY_VAULT_NAME.vault.azure.net/secrets/emailconnection
  - name: hangfirepassword
    keyVaultUrl: https://YOUR_KEY_VAULT_NAME.vault.azure.net/secrets/HangfirePassword
  - name: graphdefaultuserpassword
    keyVaultUrl: https://YOUR_KEY_VAULT_NAME.vault.azure.net/secrets/GraphDefaultUserPassword        
  - name: osplacesapikey
    keyVaultUrl: https://YOUR_KEY_VAULT_NAME.vault.azure.net/secrets/osplacesapikey
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: ASPNETCORE_URLS
    value: http://+:80
  - name: AzureAd__Instance
    value: https://YOUR_TENANT.ciamlogin.com/
  - name: AzureAd__Domain
    value: YOUR_TENANT.onmicrosoft.com
  - name: AzureAd__ClientId
    value: YOUR_CLIENT_ID
  - name: AzureAd__TenantId
    value: YOUR_TENANT_ID
  - name: DefaultAdminUser__Email
    value: admin@YOUR_TENANT.onmicrosoft.com
  - name: DefaultAdminUser__SubId
    value: YOUR_ADMIN_USER_SUBJECT_ID
  - name: Graph__ApplicationId
    value: YOUR_CLIENT_ID
  - name: Graph__ApplicationObjectId
    value: YOUR_APPLICATION_OBJECT_ID
  - name: Graph__DefaultUserPassword
    secretRef: graphdefaultuserpassword
  - name: Graph__Domain
    value: YOUR_TENANT.onmicrosoft.com
  - name: Graph__EnterpriseApplicationObjectId
    value: YOUR_ENTERPRISE_APPLICATION_OBJECT_ID
  - name: Graph__TenantId
    value: YOUR_TENANT_ID
  - name: Hangfire__User
    value: YOUR_HANGFIRE_USER
  - name: HangfirePassword
    secretRef: hangfirepassword
  - name: ConnectionStrings__DefaultConnection
    secretRef: dbconnection
  - name: ConnectionStrings__BlobStorage
    secretRef: blobconnection
  - name: AzureBlob__ConnectionString
    secretRef: blobconnection
  - name: AzureAd__ClientSecret
    secretRef: graphsecret
  - name: OsPlaces__ApiKey
    secretRef: osplacesapikey
  - name: OsPlaces__BaseUrl
    value: https://api.os.uk/search/places/v1
  - name: Sentry__Dsn
    value: <your-sentry-api-key>
  - name: SendGrid__SenderEmail
    value: no-reply@YOUR_TENANT.onmicrosoft.com
  - name: AzureAd__TokenValidationParameters__ValidIssuer
    value: https://YOUR_TENANT_ID.ciamlogin.com/YOUR_TENANT_ID/v2.0
  - name: ApplicationInsights__ConnectionString
    value: InstrumentationKey=YOUR_INSTRUMENTATION_KEY;IngestionEndpoint=https://YOUR_REGION.in.applicationinsights.azure.com/;LiveEndpoint=https://YOUR_REGION.livediagnostics.monitor.azure.com/;ApplicationId=YOUR_APPLICATION_ID
  - name: Smtp__EmailConnection
    secretRef: emailconnection    