#@ load("@ytt:data", "data")
---
apiVersion: 2024-02-02-preview
name: #@ data.values.app_name
type: microsoft.app/containerapps
location: #@ data.values.location
tags: #@ data.values.tags
identity:
  type: SystemAssigned,UserAssigned
  userAssignedIdentities:
    #@yaml/text-templated-strings
    (@= data.values.managed_identity_resource_id @): {}
properties:
  managedEnvironmentId: #@ data.values.managed_environment_id
  workloadProfileName: #@ data.values.workload_profile_name
  configuration:
    activeRevisionsMode: Single
    maxInactiveRevisions: 0
    #@ if/end len(data.values.secrets) > 0:
    secrets:
      #@ for secret in data.values.secrets:
      - name: #@ secret.name
        keyVaultUrl: #@ secret.keyVaultUrl
        identity: #@ data.values.managed_identity_resource_id
      #@ end
    registries:
      - server: #@ data.values.acr_login_server
        identity: #@ data.values.managed_identity_resource_id
    ingress:
      external: #@ data.values.external
      targetPort: #@ data.values.target_port
      transport: #@ data.values.transport
      allowInsecure: #@ data.values.allow_insecure
  template:
    revisionSuffix: #@ data.values.revision_suffix
    containers:
      - name: #@ data.values.app_name
        image: #@ data.values.image
        #@ if/end len(data.values.env) > 0:
        env:
          #@ for env_var in data.values.env:
          - name: #@ env_var.name
            #@ if env_var.secretRef != "":
            secretRef: #@ env_var.secretRef
            #@ else:
            value: #@ env_var.value
            #@ end
          #@ end
        resources:
          cpu: #@ data.values.resources.cpu
          memory: #@ data.values.resources.memory
          ephemeralStorage: #@ data.values.resources.ephemeral_storage
    scale:
      minReplicas: #@ data.values.min_replicas
      maxReplicas: #@ data.values.max_replicas
