name: Build and Deploy
run-name: "Deploy to ${{ inputs.environment || 'dev' }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select the target environment
        required: true
        type: choice
        options:
          - dev
          - tst
          - prd
        default: dev

jobs:
  deploy:
    runs-on: ${{ vars.PROJECTLABEL }}-selfhosted-runner
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        app:
          - api
          - client

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Carvel ytt
        uses: carvel-dev/setup-action@v2
        with:
          token: ${{ github.token }}
          only: ytt

      - name: Set environment variables
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ matrix.app }}"
          ENV="${{ inputs.environment || 'dev' }}"

          if [ "${APP}" = "api" ]; then
            APP_NAME="${{ vars.API_CONTAINER_APP }}"
            DOCKERFILE_PATH="./api/src/Api/Dockerfile"
            BUILD_CONTEXT="./api"
            IMAGE_PATH="hby/family-hubs-api:${{ github.sha }}"
          else
            APP_NAME="${{ vars.CLIENT_CONTAINER_APP }}"
            DOCKERFILE_PATH="./client/Dockerfile"
            BUILD_CONTEXT="./client"
            IMAGE_PATH="hby/family-hubs-client:${{ github.sha }}"
          fi

          echo "APP=${APP}" >> "$GITHUB_ENV"
          echo "ENV=${ENV}" >> "$GITHUB_ENV"

          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"
          echo "DOCKERFILE_PATH=${DOCKERFILE_PATH}" >> "$GITHUB_ENV"
          echo "BUILD_CONTEXT=${BUILD_CONTEXT}" >> "$GITHUB_ENV"
          echo "IMAGE_PATH=${IMAGE_PATH}" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${IMAGE_PATH}" >> "$GITHUB_ENV"
          echo "REVISION_SUFFIX=${{ github.run_number }}-${{ github.run_attempt }}-${APP}" >> "$GITHUB_ENV"

      - name: Show reusable-template config
        shell: bash
        run: |
          {
            echo "### Reusable Template Config"
            echo
            echo "- app: ${APP}"
            echo "- values: deploy/${APP}/containerapps/values-${ENV}.yaml"
            echo "- template: deploy/${APP}/containerapps/template.yaml"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check values file exists
        shell: bash
        run: |
          if [ ! -f "deploy/${APP}/containerapps/values-${ENV}.yaml" ]; then
            echo "Error: Values file deploy/${APP}/containerapps/values-${ENV}.yaml does not exist"
            exit 1
          fi

      - name: Render Container App YAML with ytt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "deploy/${APP}/containerapps/rendered"

          ytt \
            -f "deploy/${APP}/containerapps/values-schema.yaml" \
            -f "deploy/${APP}/containerapps/template.yaml" \
            -f "deploy/${APP}/containerapps/values-${ENV}.yaml" \
            --data-value app_name="${APP_NAME}" \
            --data-value acr_login_server="${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io" \
            --data-value image="${FULL_IMAGE}" \
            --data-value revision_suffix="${REVISION_SUFFIX}" \
            > "deploy/${APP}/containerapps/rendered/${APP_NAME}-${ENV}.yaml"

      - name: Validate rendered Azure resource IDs
        shell: bash
        run: |
          set -euo pipefail
          rendered_yaml="deploy/${APP}/containerapps/rendered/${APP_NAME}-${ENV}.yaml"

          if grep -Eq 'YOUR_|__SET_' "$rendered_yaml"; then
            echo "Error: Rendered YAML still contains placeholder values."
            exit 1
          fi

      - name: Print rendered Container App YAML
        shell: bash
        run: |
          echo "### Rendered YAML: deploy/${APP}/containerapps/rendered/${APP_NAME}-${ENV}.yaml"
          cat "deploy/${APP}/containerapps/rendered/${APP_NAME}-${ENV}.yaml"

      - name: Show rendered identity config
        shell: bash
        run: |
          set -euo pipefail
          rendered_yaml="deploy/${APP}/containerapps/rendered/${APP_NAME}-${ENV}.yaml"

          {
            echo "### Rendered identity config for ${APP_NAME}"
            echo
            echo '```yaml'
            sed -n '/^identity:/,/^properties:/p' "$rendered_yaml"
            sed -n '/^[[:space:]]*registries:/,/^[[:space:]]*ingress:/p' "$rendered_yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract Dapr config from rendered YAML
        id: rendered_dapr
        shell: bash
        run: |
          set -euo pipefail
          rendered_yaml="deploy/${APP}/containerapps/rendered/${APP_NAME}-${ENV}.yaml"

          extract_dapr_value() {
            local key="$1"
            sed -n '/^[[:space:]]*dapr:[[:space:]]*$/,/^[[:space:]]*template:[[:space:]]*$/p' "$rendered_yaml" \
              | awk -F: -v key="$key" '
                  $1 ~ ("^[[:space:]]*" key "[[:space:]]*$") {
                    value = $0
                    sub(/^[^:]*:[[:space:]]*/, "", value)
                    sub(/[[:space:]]+#.*/, "", value)
                    gsub(/^"|"$/, "", value)
                    print value
                    exit
                  }
                '
          }

          enabled="$(extract_dapr_value enabled | tr '[:upper:]' '[:lower:]')"
          app_id="$(extract_dapr_value appId)"
          app_port="$(extract_dapr_value appPort)"
          app_protocol="$(extract_dapr_value appProtocol)"
          log_level="$(extract_dapr_value logLevel)"

          {
            echo "enabled=${enabled}"
            echo "app_id=${app_id}"
            echo "app_port=${app_port}"
            echo "app_protocol=${app_protocol}"
            echo "log_level=${log_level}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract bootstrap config from rendered YAML
        id: rendered_bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rendered_yaml="deploy/${APP}/containerapps/rendered/${APP_NAME}-${ENV}.yaml"

          extract_scalar() {
            local key="$1"
            awk -F': ' -v key="$key" '
              $1 ~ ("^[[:space:]]*" key "$") {
                value = $2
                sub(/^[[:space:]]+/, "", value)
                gsub(/^"|"$/, "", value)
                print value
                exit
              }
            ' "$rendered_yaml"
          }

          managed_environment_id="$(extract_scalar managedEnvironmentId)"
          workload_profile_name="$(extract_scalar workloadProfileName)"
          managed_identity_resource_id="$(sed -n '/^[[:space:]]*userAssignedIdentities:[[:space:]]*$/{
            n
            s/^[[:space:]]*//
            s/^\?[[:space:]]*//
            s/:[[:space:]]*{}$//
            p
            q
          }' "$rendered_yaml")"

          if [ -z "${managed_environment_id}" ] || [ -z "${workload_profile_name}" ] || [ -z "${managed_identity_resource_id}" ]; then
            echo "Error: Unable to extract bootstrap settings from ${rendered_yaml}"
            exit 1
          fi

          {
            echo "managed_environment_id=${managed_environment_id}"
            echo "workload_profile_name=${workload_profile_name}"
            echo "managed_identity_resource_id=${managed_identity_resource_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}

      - name: Generate client config
        if: ${{ env.APP == 'client' }}
        shell: bash
        run: |
          cat > ./client/src/config.json << EOF
          {
            "api_url": "${{ vars.CLIENT_API_URL }}",
            "ad_tenant_id": "${{ vars.CLIENT_AD_TENANT_ID }}",
            "ad_authority": "${{ vars.CLIENT_AD_AUTHORITY }}",
            "ad_client_id": "${{ vars.CLIENT_AD_CLIENT_ID }}",
            "ad_scope": "${{ vars.CLIENT_AD_SCOPE }}",
            "ad_redirect_uri": "${{ vars.CLIENT_BASE_PATH || '/' }}",
            "ad_domain_hint": "${{ vars.CLIENT_AD_DOMAIN_HINT }}",
            "accessibility_testing_enabled": "false",
            "app_insights_connection_string": "${{ vars.CLIENT_APP_INSIGHTS_CONNECTION_STRING || '' }}",
            "sentry_dsn": "",
            "clarity_project_id": "${{ vars.CLARITY_PROJECT_ID || '' }}"
          }
          EOF

      - name: Build image in ACR
        shell: bash
        run: |
          set -euo pipefail

          cmd=(az acr build
            --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}"
            --registry "${{ vars.AZURE_CONTAINER_REGISTRY }}"
            --source-acr-auth-id [caller]
            --image "${IMAGE_PATH}"
            --file "${DOCKERFILE_PATH}"
          )

          if [ "${APP}" = "client" ]; then
            cmd+=(--build-arg "VITE_BASE_PATH=${{ vars.CLIENT_BASE_PATH || '/' }}")
          fi

          cmd+=("${BUILD_CONTEXT}")
          "${cmd[@]}"

      - name: Check whether Container App exists
        id: app_exists
        shell: bash
        run: |
          set -euo pipefail
          if az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" \
            > /dev/null 2>&1; then

            echo "✅ API Container App ' ${{ env.APP_NAME }}' exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ API Container App ' ${{ env.APP_NAME }}' does not exist. Registry configuration will commence.."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap Container App with public image
        if: ${{ steps.app_exists.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          # Bootstrap with a public image so the app and user-assigned identity exist
          # before the private ACR image is applied on update.
          az containerapp create \
            --name "${APP_NAME}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" \
            --environment "${{ steps.rendered_bootstrap.outputs.managed_environment_id }}" \
            --user-assigned "${{ steps.rendered_bootstrap.outputs.managed_identity_resource_id }}" \
            --workload-profile-name "${{ steps.rendered_bootstrap.outputs.workload_profile_name }}" \
            --image "mcr.microsoft.com/k8se/quickstart:latest" \
            --output none

      - name: Configure Container App registry auth
        if: ${{ steps.app_exists.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          az containerapp registry set \
            --name "${APP_NAME}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" \
            --server "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io" \
            --identity "${{ steps.rendered_bootstrap.outputs.managed_identity_resource_id }}" \
            --output none

      - name: Update Container App via dac-shared action
        uses: dhsc-govuk-infrastructure/dac-shared/.github/actions/containerapp-update-from-yaml@main
        with:
          app_name: ${{ env.APP_NAME }}
          azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
          container_app_yaml_path: deploy/${{ env.APP }}/containerapps/rendered/${{ env.APP_NAME }}-${{ env.ENV }}.yaml
          image_to_deploy: ${{ env.FULL_IMAGE }}
          dapr_enabled: ${{ steps.rendered_dapr.outputs.enabled }}
          dapr_app_id: ${{ steps.rendered_dapr.outputs.app_id }}
          dapr_app_port: ${{ steps.rendered_dapr.outputs.app_port }}
          dapr_app_protocol: ${{ steps.rendered_dapr.outputs.app_protocol }}
          dapr_log_level: ${{ steps.rendered_dapr.outputs.log_level }}
          azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}

      - name: Add deployment summary
        shell: bash
        run: |
          fqdn="$(az containerapp show --name "${APP_NAME}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --subscription "${{ vars.AZURE_RTL_SUBSCRIPTION_ID }}" --query "properties.configuration.ingress.fqdn" -o tsv)"
          {
            echo "### ${APP_NAME} deployment"
            echo
            echo "- image: ${FULL_IMAGE}"
            echo "- url: https://${fqdn}"
          } >> "$GITHUB_STEP_SUMMARY"
